name: ScarlettX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    name: build-and-test-windows (${{ matrix.build_type }})
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build ScarlettX + HLE Shims + Synthetic Games
        run: cmake --build build --parallel

      - name: Run Autonomous Test Suite (Manifest, PE, Kernel, D3D12 WARP, RT/BVH, Boot)
        run: ctest --test-dir build --output-on-failure

      - name: Upload Rendered Frame Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scarlettx-test-frames-${{ matrix.build_type }}
          path: |
            build/*.ppm
          if-no-files-found: ignore

      - name: Summarize Failed Tests
        if: failure()
        shell: pwsh
        run: |
          $dir = "build/Testing/Temporary"
          if (Test-Path "$dir/LastTestsFailed.log") {
            Write-Host "Failed tests:"; Get-Content "$dir/LastTestsFailed.log"
          }
          if (Test-Path "$dir/LastTest.log") {
            Select-String -Path "$dir/LastTest.log" -Pattern 'check failed|Test Failed|Exit code|Exception|FAIL|\[sx\]|error' |
              Select-Object -First 30 | ForEach-Object { $_.Line }
          }
