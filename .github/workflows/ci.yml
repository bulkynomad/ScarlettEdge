name: ScarlettEdge CI (Windows MSVC)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clean-Room & IP Hygiene Gate
        run: python tools/check_cleanroom.py --commit-range HEAD~1..HEAD

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (Ninja)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build ScarlettEdge
        run: cmake --build build

      - name: Run CTest Suite (Parallel + Output on Failure)
        run: ctest --test-dir build --parallel 4 --output-on-failure

      - name: Smoke Test scarlettx inspect, compat & diag CLI
        run: |
          ./build/scarlettx.exe inspect ./build/packages/hello_scarlett
          ./build/scarlettx.exe compat ./build/packages/hello_scarlett
          ./build/scarlettx.exe diag
          ./build/scarlettx.exe diag --full

      - name: Package Portable ScarlettEdge-win64.zip
        shell: pwsh
        run: |
          $stage = "dist/ScarlettEdge-win64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "build/scarlettx.exe" -Destination $stage
          $excluded = @("xtelemetry_missing.dll", "xgameoverlay_missing.dll", "xordinal_hle.dll")
          Get-ChildItem -Path "build" -Filter "*.dll" -File |
            Where-Object { $excluded -notcontains $_.Name } |
            ForEach-Object { Copy-Item -Path $_.FullName -Destination $stage }
          Copy-Item -Path "CLEANROOM_POLICY.md", "README.md" -Destination $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/ScarlettEdge-win64.zip" -Force
          Get-Item "dist/ScarlettEdge-win64.zip" | Select-Object Name, Length

      - name: Upload Portable Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScarlettEdge-win64
          path: dist/ScarlettEdge-win64.zip
          if-no-files-found: error
